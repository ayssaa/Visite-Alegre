<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Visite Alegre</title>
</head>
<body>

    <header>
        <div class="title"><a href="/inicio.html"><img src="/img/VisiteAlegreLogo.png" alt=""></a></div>
        <menu>
            <nav>
                <a href="/inicio.html"><img src="img/inicio.svg" alt=""><span>Início</span></a>
                <a href="/pontos.html"><img src="img/pontos.svg" alt=""><span>Pontos Turísticos</span></a>
                <a href="/eventos.html"><img src="img/eventos.svg" alt=""><span>Eventos</span></a>
                <a href="/roteiro.html"><img src="img/roteiro.svg" alt=""><span>Roteiro</span></a>
                <a href="/turistas.html"><img src="img/mochila.svg" alt=""><span>Turistas</span></a>
                <a href="/guias.html" class="ativo"><img src="img/guias.svg" alt=""><span>Guias</span></a>
                <a href="/login.html"><img src="img/sair.svg" alt=""><span>Sair</span></a>
            </nav>
        </menu>
    </header>

    <main>
        
        <div class="painel-guia">
            <div class="cabecalho-guia">
                <div class="bemvindo-texto">
                    <h2>Cadastrar Guia</h2>
                    <p>Preencha os dados abaixo para cadastrar um novo guia turístico.</p>
                </div>

                <div class="guia-imagem">
                    <img src="/img/ratopeiraOi.png" alt="">
                </div>
            </div>

            <div class="cadastro">
                
                <div class="titulo">
                    <img src="/img/guias.svg" alt="">
                    <h2>Dados do Guia</h2>
                </div>


                <div class="dados-guias">
                    <div class="cima">
                        <div class="dado-guia">
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo">
                        </div>

                        <div class="dado-guia">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                        </div>

                        <div class="dado-guia">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                        </div>
                    </div>

                    <div class="baixo">
                        <div class="dado-guia">
                            <label for="tel">Telefone</label>
                            <input type="tel" id="tel" name="tel" placeholder="(28) 99999-9999">
                        </div>

                        <div class="dado-guia">
                            <label for="number">Anos de expeciência</label>
                            <input type="number" id="number" name="number" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="titulo linha">
                    <img src="/img/local.svg" alt="">
                    <h2>Endereço</h2>
                </div>

                <div class="dados-endereco">
                    <div class="cima">
                        <div class="dado-guia">
                            <label for="logradouro">Logradouro</label>
                            <input type="text" id="logradouro" name="logradouro" placeholder="Rua, Avenida, etc.">
                        </div>

                        <div class="dado-guia pequeno">
                            <label for="numero">Número</label>
                            <input type="number" id="numero" name="numero" placeholder="N°">
                        </div>

                        <div class="dado-guia">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro">
                        </div>
                    </div>

                    <div class="baixo">
                        <div class="dado-guia">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
                        </div>

                        <div class="dado-guia pequeno">
                            <label for="estado">UF</label>
                            <select id="estado" name="estado">
                                <option value="">Selecione</option>
                                <option value="AC">AC</option>
                                <option value="AL">AL</option>
                                <option value="AP">AP</option>
                                <option value="AM">AM</option>
                                <option value="BA">BA</option>
                                <option value="CE">CE</option>
                                <option value="DF">DF</option>
                                <option value="ES">ES</option>
                                <option value="GO">GO</option>
                                <option value="MA">MA</option>
                                <option value="MT">MT</option>
                                <option value="MS">MS</option>
                                <option value="MG">MG</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="PR">PR</option>
                                <option value="PE">PE</option>
                                <option value="PI">PI</option>
                                <option value="RJ">RJ</option>
                                <option value="RN">RN</option>
                                <option value="RS">RS</option>
                                <option value="RO">RO</option>
                                <option value="RR">RR</option>
                                <option value="SC">SC</option>
                                <option value="SP">SP</option>
                                <option value="SE">SE</option>
                                <option value="TO">TO</option>
                            </select>
                        </div>

                        <div class="dado-guia">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000">
                        </div>
                    </div>
                </div>

                <a href="/inicio.html">
                    <div class="salvar">
                        <p>Salvar guia</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <footer>

    </footer>

</body>
</html>
